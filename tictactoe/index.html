<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      background: linear-gradient(135deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.8rem;
      letter-spacing: 1px;
      color: #a8dadc;
      transition: color 0.3s;
    }

    .status.winner { color: #e94560; font-weight: bold; }
    .status.draw   { color: #f4a261; font-weight: bold; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 10px;
    }

    .cell {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.2s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      border-color: #e94560;
      transform: scale(1.04);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }
    .cell.winning { background: #0f3460; border-color: #f4a261; animation: pulse 0.6s ease-in-out infinite alternate; }

    @keyframes pulse {
      from { box-shadow: 0 0 0 0 rgba(244, 162, 97, 0.4); }
      to   { box-shadow: 0 0 0 12px rgba(244, 162, 97, 0); }
    }

    .scoreboard {
      display: flex;
      gap: 2rem;
      margin: 1.8rem 0 1.2rem;
    }

    .score-box {
      text-align: center;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 0.7rem 1.4rem;
      min-width: 80px;
    }

    .score-box .label { font-size: 0.75rem; letter-spacing: 2px; color: #888; text-transform: uppercase; }
    .score-box .value { font-size: 1.8rem; font-weight: bold; }
    .score-box.x-box .value { color: #e94560; }
    .score-box.o-box .value { color: #a8dadc; }
    .score-box.draw-box .value { color: #f4a261; }

    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button {
      padding: 0.65rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-restart {
      background: #e94560;
      color: #fff;
    }

    .btn-reset {
      background: #0f3460;
      color: #a8dadc;
      border: 1px solid #a8dadc55;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="status" id="status">Player X's turn</div>

  <div class="board" id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <div class="scoreboard">
    <div class="score-box x-box">
      <div class="label">X Wins</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="score-box draw-box">
      <div class="label">Draws</div>
      <div class="value" id="score-d">0</div>
    </div>
    <div class="score-box o-box">
      <div class="label">O Wins</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-restart" onclick="restartGame()">New Game</button>
    <button class="btn-reset" onclick="resetScore()">Reset Score</button>
  </div>

  <script>
    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let board = Array(9).fill(null);
    let current = 'X';
    let gameOver = false;
    const score = { X: 0, O: 0, D: 0 };

    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');

    cells.forEach(cell => cell.addEventListener('click', () => handleClick(+cell.dataset.i)));

    function handleClick(i) {
      if (gameOver || board[i]) return;
      board[i] = current;
      cells[i].textContent = current;
      cells[i].classList.add(current.toLowerCase(), 'taken');

      const winLine = checkWin();
      if (winLine) {
        winLine.forEach(idx => cells[idx].classList.add('winning'));
        status.textContent = `Player ${current} wins!`;
        status.className = 'status winner';
        score[current]++;
        updateScore();
        gameOver = true;
        return;
      }
      if (board.every(Boolean)) {
        status.textContent = "It's a draw!";
        status.className = 'status draw';
        score.D++;
        updateScore();
        gameOver = true;
        return;
      }
      current = current === 'X' ? 'O' : 'X';
      status.textContent = `Player ${current}'s turn`;
      status.className = 'status';
    }

    function checkWin() {
      return WINS.find(([a, b, c]) => board[a] && board[a] === board[b] && board[a] === board[c]) || null;
    }

    function restartGame() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
      status.textContent = "Player X's turn";
      status.className = 'status';
    }

    function resetScore() {
      score.X = score.O = score.D = 0;
      updateScore();
      restartGame();
    }

    function updateScore() {
      document.getElementById('score-x').textContent = score.X;
      document.getElementById('score-o').textContent = score.O;
      document.getElementById('score-d').textContent = score.D;
    }
  </script>
</body>
</html>
